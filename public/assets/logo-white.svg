<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" fill="none" width="100%" height="100%">
  <!-- Symbol: Caring hands cradling a sacred lotus flower (Inverted / White variant) -->
  <g transform="translate(10, 5)">
    <!-- Central Lotus Petal (Gold) -->
    <path d="M50 15 C45 35 48 55 50 68 C52 55 55 35 50 15 Z" fill="#CDA05F" />
    
    <!-- Inner Lotus Petals (Sage Green lightened) -->
    <path d="M50 25 C40 38 34 52 38 68 C44 67 48 65 50 68 C49 55 46 38 50 25 Z" fill="#A7C2B0" />
    <path d="M50 25 C60 38 66 52 62 68 C56 67 52 65 50 68 C51 55 54 38 50 25 Z" fill="#A7C2B0" />
    
    <!-- Outer Lotus Petals (Gold) -->
    <path d="M48 38 C32 46 22 62 26 76 C33 74 41 71 45 68 C40 60 42 48 48 38 Z" fill="#CDA05F" opacity="0.9" />
    <path d="M52 38 C68 46 78 62 74 76 C67 74 59 71 55 68 C60 60 58 48 52 38 Z" fill="#CDA05F" opacity="0.9" />
    
    <!-- Protective Caring Hands Base (White & Gold Accent) -->
    <path d="M12 70 C16 62 28 66 38 72 C44 75 48 78 50 82 C46 84 40 85 32 83 C22 81 14 77 12 70 Z" fill="#FFFFFF" />
    <path d="M16 75 C24 85 36 94 50 96 C50 92 48 86 42 82 C34 78 24 76 16 75 Z" fill="#E5ECE7" />
    
    <!-- Right Hand Cradling -->
    <path d="M88 70 C84 62 72 66 62 72 C56 75 52 78 50 82 C54 84 60 85 68 83 C78 81 86 77 88 70 Z" fill="#FFFFFF" />
    <path d="M84 75 C76 85 64 94 50 96 C50 92 52 86 58 82 C66 78 76 76 84 75 Z" fill="#E5ECE7" />
    
    <!-- Lotus Core -->
    <circle cx="50" cy="71" r="4.5" fill="#CDA05F" />
    <circle cx="50" cy="71" r="2" fill="#FFFFFF" />
  </g>

  <!-- Typography: Mehrban Care -->
  <text x="120" y="52" font-family="'Plus Jakarta Sans', 'Manrope', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Mehrban</text>
  <text x="272" y="52" font-family="'Plus Jakarta Sans', 'Manrope', 'Segoe UI', sans-serif" font-size="34" font-weight="300" fill="#CDA05F" letter-spacing="0.5">Care</text>
  
  <text x="122" y="76" font-family="'Plus Jakarta Sans', 'Manrope', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#A7C2B0" letter-spacing="3.2">ELDERLY HOME CARE</text>
  
  <text x="122" y="94" font-family="'Noto Nastaliq Urdu', 'Noto Sans Arabic', sans-serif" font-size="13" font-weight="500" fill="#E5ECE7" opacity="0.9">مہربان کیئر • بزرگوں کی باوقار گھریلو دیکھ بھال</text>
</svg>
